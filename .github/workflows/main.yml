name: Build and Publish Clio Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish App
      run: |
        dotnet publish -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true -o ./publish

    - name: Zip the build
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./clio-desktop-release.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: clio-release ${{ github.ref_name }}
        files: clio-desktop-release.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
